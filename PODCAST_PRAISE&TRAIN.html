Se você já se perguntou se Deus desistiu do seu povo, ou onde você, vindo de fora, entra nessa história, fica com a gente. Esse episódio é pra correr leve e pensar fundo.

Vamos falar de promessa, de ciúme santo, de oliveira enxertada e de um mistério que termina em adoração. Respira, ajusta o pace, e vem comigo.`},{id:"resumo",title:"Resumo",text:`Romanos 9 a 11 é uma pausa necessária. Paulo vinha falando de justificação pela fé, e surge a pergunta inevitável: e Israel? Deus falhou?

No capítulo 11, ele responde com firmeza e ternura. Não, Deus não rejeitou o seu povo. Ele mesmo é a prova, um israelita da tribo de Benjamim. Sempre houve um remanescente, escolhido pela graça.

A história não acabou. O que vemos é um movimento maior, onde a desobediência de uns abre porta para outros, sem cancelar a promessa original. É sobre fidelidade, não sobre performance.`},{id:"contexto",title:"Contexto Histórico",text:`Pensa na igreja de Roma. Judeus e gentios juntos, com tensões reais. Os gentios começavam a se achar superiores, como se fossem a nova versão melhorada.

Paulo escreve para corrigir essa arrogância espiritual. Ele lembra que a raiz sustenta o ramo, e não o contrário. A raiz é a aliança, as promessas feitas a Abraão, Isaque e Jacó.

Israel tinha a lei, os profetas, a adoração. Os gentios foram incluídos por misericórdia. Entender isso muda a forma como a gente corre lado a lado hoje, na igreja. Ninguém corre sozinho.`},{id:"provas",title:"Provas",text:`Paulo traz duas provas de que Deus não abandonou Israel. Primeiro, ele mesmo. Se Deus tivesse rejeitado Israel, Paulo estaria fora. Mas ele está dentro, salvo, pregando.

Segundo, o remanescente. Como nos dias de Elias, quando Deus preservou sete mil que não dobraram os joelhos a Baal, assim agora há um resto segundo a eleição da graça.

Isso não é sobre merecimento. Se é por graça, já não é por obras. Essa lógica liberta. Deus preserva um povo porque Ele é fiel ao que prometeu, não porque o povo foi perfeito.`},{id:"endurecimento",title:"Endurecimento",text:`Aqui vem a parte mais sensível. Houve um endurecimento em parte de Israel, até que a plenitude dos gentios entre. Não é um endurecimento total, nem final.

Deus permitiu que tropeçassem para que a salvação chegasse aos gentios. E esse movimento provoca ciúme, no bom sentido. Um ciúme que desperta desejo de voltar.
