<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soli Deo Gloria — Regra de Vida Cristã Reformada</title>
<meta name="description" content="Um app pessoal com os 30 princípios bíblicos da vida cristã reformada: estudos, devocionais, desafios práticos, checklist diário e painel de progresso.">
<meta name="theme-color" content="#7d2222">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="seal">SDG</div>
      <div class="brand-text">
        <div class="kicker">Regra de Vida</div>
        <h1>Soli Deo<br>Gloria</h1>
        <div id="user-name-slot"></div>
      </div>
    </div>
    <nav class="primary-nav" id="nav-list"></nav>
    <div class="sidebar-footer">
      <div id="theme-toggle-slot"></div>
      <div id="privacy-note-slot"></div>
      <div class="install-hint">Instale este app na tela inicial pelo menu do navegador para uso offline.</div>
      <button class="toggle-link" id="tour-replay-btn" style="text-align:left;">↻ Rever o tour de boas-vindas</button>
    </div>
  </aside>

  <div>
    <div class="topbar">
      <button class="hamburger" onclick="SDG_toggleSidebar()" aria-label="Abrir menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand" style="gap:8px;">
        <div class="seal" style="width:32px;height:32px;font-size:10px;">SDG</div>
        <div>
          <strong style="font-family:var(--font-display); font-size:17px; display:block;">Soli Deo Gloria</strong>
          <div id="user-name-slot-mobile"></div>
        </div>
      </div>
      <div style="width:38px;"></div>
    </div>

    <main class="view" id="view-root"></main>
  </div>
</div>

<nav class="tabbar">
  <button class="tab-item" onclick="SDG_goTo('inicio')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Início
  </button>
  <button class="tab-item" onclick="SDG_goTo('principios')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>Artigos
  </button>
  <button class="tab-item" onclick="SDG_goTo('checklist')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Checklist
  </button>
  <button class="tab-item" onclick="SDG_goTo('progresso')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Progresso
  </button>
  <button class="tab-item" onclick="SDG_goTo('favoritos')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6.7-4.35-9.3-8.2C1 10 1.7 6.6 4.6 5.2c2.2-1 4.6-.2 5.9 1.6L12 8.5l1.5-1.7c1.3-1.8 3.7-2.6 5.9-1.6 2.9 1.4 3.6 4.8 1.9 7.6C18.7 16.65 12 21 12 21z"/></svg>Favoritos
  </button>
</nav>

<div class="toast" id="toast"></div>

<script src="./data.js"></script>
<script src="./app.js"></script>
<script src="./onboarding.js"></script>
</body>
</html>
