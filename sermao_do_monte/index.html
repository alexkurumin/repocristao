<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sermão do Monte — Mateus 5, 6 e 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital@0;1&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- fundo aquarelado ambiente -->
<div class="watercolor-bg" aria-hidden="true">
  <span class="wash wash-1"></span>
  <span class="wash wash-2"></span>
  <span class="wash wash-3"></span>
  <span class="wash wash-4"></span>
</div>

<!-- ===================== TELA DE CAPA ===================== -->
<section id="cover" class="cover">
  <div class="cover-card">
    <p class="cover-eyebrow" data-i18n="siteSubtitle">Mateus 5, 6 e 7</p>
    <h1 class="cover-title" data-i18n="siteTitle">Sermão do Monte</h1>
    <div class="cover-brushline" aria-hidden="true"></div>

    <p class="cover-note" data-i18n="coverNote">O texto das Escrituras é apresentado somente em português, na versão NTLH.</p>

    <div class="lang-picker" role="group" aria-label="Idioma">
      <span class="lang-picker-label" data-i18n="chooseLanguage">Escolha o idioma</span>
      <div class="lang-buttons">
        <button class="lang-btn is-active" data-lang="pt" type="button">Português BR</button>
        <button class="lang-btn" data-lang="en" type="button">English</button>
        <button class="lang-btn" data-lang="es" type="button">Español</button>
        <button class="lang-btn" data-lang="it" type="button">Italiano</button>
      </div>
    </div>

    <button id="startBtn" class="start-btn" type="button">
      <span data-i18n="startButton">Abrir o livro</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>

<!-- ===================== LIVRO / PÁGINAS ===================== -->
<section id="book-view" class="book-view" hidden>

  <header class="book-header">
    <button id="homeBtn" class="icon-btn" type="button" data-i18n-aria="home" aria-label="Voltar à capa">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 5l8 6.5M6 10v9h5v-5h2v5h5v-9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="book-header-title">
      <span class="book-header-name" data-i18n="siteTitle">Sermão do Monte</span>
      <span class="book-header-sub" data-i18n="siteSubtitle">Mateus 5, 6 e 7</span>
    </div>
    <div class="lang-mini" role="group" aria-label="Idioma">
      <button class="lang-mini-btn is-active" data-lang="pt" type="button">BR</button>
      <button class="lang-mini-btn" data-lang="en" type="button">EN</button>
      <button class="lang-mini-btn" data-lang="es" type="button">ES</button>
      <button class="lang-mini-btn" data-lang="it" type="button">IT</button>
    </div>
  </header>

  <div class="book-stage">
    <button id="prevBtn" class="turn-btn turn-btn-prev" type="button" aria-label="Página anterior">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5 7 12l8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="book" id="book">
      <!-- as folhas (leaves) são inseridas dinamicamente pelo JS -->
    </div>

    <button id="nextBtn" class="turn-btn turn-btn-next" type="button" aria-label="Próxima página">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 5l8 7-8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <footer class="book-footer">
    <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
    <span id="pageIndicator" class="page-indicator">Página 1 de 25</span>
    <span class="swipe-hint" data-i18n="swipeHint">Toque nas bordas ou arraste para virar a página</span>
  </footer>
</section>

<!-- ===================== RODAPÉ GLOBAL ===================== -->
<footer class="site-footer">
  <p class="site-footer-title" data-i18n="footerTitle">Baseado na versão NTLH</p>
  <p class="site-footer-sub" data-i18n="footerSubtitle">Honra e Glória ao Único e Eterno Deus</p>
</footer>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
