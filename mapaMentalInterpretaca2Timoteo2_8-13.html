c:"Perfeito passivo: foi ressuscitado e permanece ressurreto. Prova histórica e garantia da nossa justificação (Rm 4:25). Contra o gnosticismo, Paulo afirma a corporeidade da ressurreição.",greek:"ἐγηγερμένον ἐκ νεκρῶν"},{label:"Davi",title:"Spermatos Dauid",desc:"Cumprimento da promessa davídica (2Sm 7:12-16). Jesus é o legítimo herdeiro do trono. Sua realeza não é espiritualizada, é histórica e pactual. Base da esperança escatológica reformada.",calvino:'Calvino: "Duas naturezas, uma pessoa, dois estados, um ofício de Mediador."'},{label:"Meu Evangelho",title:"Kata to euangelion mou",desc:"Não é evangelho diferente, mas apropriação pactual. Paulo sofre porque este evangelho específico — da graça soberana — ofende o mérito humano. Evangelho cristocêntrico, não antropocêntrico."}],doctrine:"União Pactual com o Rei ressurreto. Fora dele, não há salvação nem perseverança."},{id:"v9-10",num:"V9-10",title:"SOFRIMENTO E MISSÃO",subtitle:"Algemado, mas a Palavra livre",color:"#7AA0C6",accent:"border-[#7AA0C6]/40",bg:"bg-[#7AA0C6]/[0.08]",icon:hr,summary:"O ministro sofre, o logos não.",subs:[{label:"Algemas",title:"Desmōn como kakourgos",desc:"Paulo literalmente acorrentado em Roma, tratado como criminoso comum. Paradoxo reformado: Deus usa meios fracos. A cruz precede a coroa, para o mestre e para o discípulo.",greek:"μέχρι δεσμῶν ὡς κακοῦργος"},{label:"Não Algemada",title:"Ou dedetai",desc:'Litotes poderosa. A Palavra não pode ser acorrentada por Nero, prisões ou cancelamentos. Doutrina da eficácia irresistível da Palavra. Lutero: "A Palavra fez tudo enquanto eu dormia".',calvino:'Calvino: "Por mais que Satanás se esforce, a verdade sempre encontrará caminho."'},{label:"Eleitos",title:"Dia tous eklektous",desc:"Sofrimento vicário com propósito teleológico. Paulo suporta tudo POR CAUSA dos eleitos. Forte afirmação da eleição incondicional. A missão não é tornar salvos possíveis, mas reunir os que já foram dados a Cristo (Jo 17:9).",greek:"διὰ τοὺς ἐκλεκτούς"},{label:"Glória Eterna",title:"Sōtērias + doxa aiōnios",desc:"Salvação não é apenas perdão, é glória eterna. Aplicação: Nosso sofrimento atual tem peso de glória (2Co 4:17). Visão calvinista não é escapista, é escatológica."}],doctrine:"Providenia e Missão: Deus decretou os fins (salvação dos eleitos) e os meios (sofrimento apostólico)."},{id:"v11-13",num:"V11-13",title:"HINO DA FIDELIDADE",subtitle:"4 Condicionais - Fiel é esta Palavra",color:"#E8D5B5",accent:"border-[#E8D5B5]/40",bg:"bg-[#E8D5B5]/[0.12]",icon:dr,summary:"Pistós ho logos - estrutura quiasmática",subs:[{label:"a) Se Morremos",title:"Ei apethanomen - Viveremos",desc:"Primeira classe condicional: fato consumado. Aoristo - morte com Cristo no batismo e conversão (Rm 6:8). União mística. Não é hipótese, é identidade. Quem morreu com Ele, já vive com Ele.",greek:"εἰ ἀπεθάνομεν, καὶ συζήσομεν"},{label:"b) Se Perseveramos",title:"Ei hypomenomen - Reinaremos",desc:"Presente ativo: perseverança contínua. Segunda marca da união. Não é causa da salvação, é evidência. Perseverança dos Santos (5º ponto). Reinar é co-herança davídica - V8 se cumpre em nós.",greek:"εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν"},{label:"c) Se Negamos",title:"Ei arnēsometha - Negará",desc:'Futuro - negação apostática final e pública. Aviso solene, não hipotético. A fé temporária não salva. Hendriksen: "A negação aqui é a repudiação definitiva de Cristo como Senhor". Quem nega, prova que nunca foi dos nossos (1Jo 2:19).',calvino:'Calvino: "Deus distingue com nota perpétua os hipócritas".'},{label:"d) Se somos Infiéis",title:"Ei apistoumen - Permanece Fiel",desc:'Presente - infidelidade momentânea, fraqueza, não apostasia. Antítese gloriosa. Nossa fé falha, a dele não. Imutabilidade divina: "ou dynatai arnēsasthai heauton" - não pode negar-se a si mesmo. Base da segurança: fidelidade ancorada no ser de Deus, não no nosso desempenho.',greek:"εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει"}],doctrine:"Quiasmo pastoral: 2 promessas (graça) + 1 ameaça (santidade) + 1 âncora (imutabilidade)."},{id:"doutrinas",num:"TULIP",title:"DOUTRINAS CALVINISTAS",subtitle:"Sistema do Hino",color:"#9FB89F",accent:"border-[#9FB89F]/40",bg:"bg-[#9FB89F]/[0.08]",icon:pr,summary:"4 pilares extraídos do texto",subs:[{label:"União",title:"Unio Mystica - syn- prefixo",desc:"Morremos COM (syn), viveremos COM, reinaremos COM. Prefixo syn- 3x. Doutrina central reformada: tudo em Cristo. Não imitação, mas incorporação federal. Fora de Cristo, nada; nele, tudo."},{label:"Perseverança",title:"Perseverantia Sanctorum",desc:"Se perseveramos... O verdadeiro eleito persevera até o fim, não por força própria, mas porque é preservado. V11-12 não são barganha, são descrição do eleito. Confissão de Westminster 17.1."},{label:"Eleição",title:"Electio - V10",desc:"Por causa dos eleitos. A missão tem alvo definido. Deus não tenta salvar, Ele salva. A evangelização reformada é confiante porque o sucesso não depende do evangelista, mas do decreto.",calvino:"Institutas 3.21.1 - Eleição é mãe da fé."},{label:"Imutabilidade",title:"Immutabilitas Dei",desc:"Não pode negar-se. Deus não muda, não mente, não falha. Nosso conforto final não é nossa fidelidade vacilante, mas sua fidelidade imutável. Base da certeza da salvação.",greek:"ἀρνήσασθαι ἑαυτὸν οὐ δύναται"}],doctrine:"O hino é um pequeno compêndio de Soteriologia Reformada."}],xt=[{id:"aplicacoes",title:"APLICAÇÕES ATUAIS",color:"#C9A86A",icon:ht,items:["1. Memória Cristológica contra ansiedade: Pregue V8 a si mesmo diariamente.","2. Sofrimento com propósito: Sua algema atual é palco para Palavra não algemada.","3. Segurança vs. Licença: V13 não autoriza infidelidade, mas consola o arrependido.","4. Ministério fiel: Pastoreie os eleitos, não o auditório. Suporte tudo por eles.","5. Liturgia: Use V11-13 como credo batismal ou resposta congregacional."]},{id:"autores",title:"AUTORES REFORMADOS",color:"#7AA0C6",icon:gr,items:['JOÃO CALVINO: "Cristo ressuscitado é a soma do Evangelho. Negar Davi é negar a promessa; negar ress
